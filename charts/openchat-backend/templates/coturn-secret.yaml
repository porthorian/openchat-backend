{{- if and .Values.coturn.enabled .Values.coturn.auth.createSecret (not .Values.coturn.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openchat-backend.coturn.authSecretName" . }}
  labels:
    {{- include "openchat-backend.coturn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.coturn.auth.usernameKey }}: {{ required "coturn.auth.username must be set when coturn auth secret is chart-managed" .Values.coturn.auth.username | quote }}
  {{ .Values.coturn.auth.passwordKey }}: {{ required "coturn.auth.password must be set when coturn auth secret is chart-managed" .Values.coturn.auth.password | quote }}
{{- end }}
